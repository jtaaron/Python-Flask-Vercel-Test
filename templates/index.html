{% extends 'layout.html' %}

{% block title %}Chat{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-10 col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form action="{{ url_for('chat') }}" method="post" class="d-flex gap-2 mb-3">
          <input name="prompt" class="form-control form-control-lg" placeholder="Type your prompt…" autocomplete="off" required>
          <button class="btn btn-primary btn-lg" type="submit">Send</button>
        </form>

        {% if response %}
          <div class="alert alert-secondary" role="alert">
            {{ response }}
          </div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
